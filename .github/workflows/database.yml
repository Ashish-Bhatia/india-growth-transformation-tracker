name: Database Validation

on:
  push:
    paths:
      - 'db/**'
      - 'schemas/**'
      - 'data/metadata/**'
      - 'scripts/db_*.py'
      - 'tests/test_database_integration.py'
      - 'tests/test_migration_files.py'
      - 'tests/test_registry_files.py'
      - 'requirements-dev.txt'
      - '.github/workflows/database.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'schemas/**'
      - 'data/metadata/**'
      - 'scripts/db_*.py'
      - 'tests/test_database_integration.py'
      - 'tests/test_migration_files.py'
      - 'tests/test_registry_files.py'
      - 'requirements-dev.txt'
      - '.github/workflows/database.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: igt_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d igt_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tracker:tracker@localhost:5432/igt_tracker

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_migration_files.py tests/test_registry_files.py -q
      - run: python scripts/db_migrate.py
      - run: python scripts/db_seed.py
      - run: python -m pytest tests/test_database_integration.py -q
